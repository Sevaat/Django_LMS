services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: lms_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # Django приложение
  backend:
    build: .
    container_name: lms_backend
    restart: unless-stopped
    command: >
      sh -c "
        poetry run python manage.py migrate &&
        poetry run python manage.py collectstatic --noinput &&
        poetry run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
      "
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
    networks:
      - lms_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Celery worker
  celery:
    build: .
    container_name: lms_celery
    restart: unless-stopped
    command: poetry run celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - db
    networks:
      - lms_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Celery beat
  celery-beat:
    build: .
    container_name: lms_celery_beat
    restart: unless-stopped
    command: poetry run celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
      - db
    networks:
      - lms_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Flower мониторинг
  flower:
    build: .
    container_name: lms_flower
    restart: unless-stopped
    command: poetry run celery -A config flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - celery
      - redis
      - db
    networks:
      - lms_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lms_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: