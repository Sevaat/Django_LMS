name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lms_db
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create false

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-ansi

    - name: Create .env file for tests
      run: |
        echo "SECRET_KEY=${{ secrets.SECRET_KEY || 'test-secret-key' }}" > .env
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=localhost" >> .env
        echo "DATABASE_NAME=lms_db" >> .env
        echo "DATABASE_USER=lms_user" >> .env
        echo "DATABASE_PASSWORD=lms_password" >> .env
        echo "DATABASE_HOST=localhost" >> .env
        echo "DATABASE_PORT=5432" >> .env
        echo "REDIS_HOST=localhost" >> .env
        echo "REDIS_PORT=6379" >> .env
        echo "REDIS_DB=0" >> .env
        echo "CELERY_BROKER_URL=redis://localhost:6379/0" >> .env
        echo "CELERY_RESULT_BACKEND=redis://localhost:6379/0" >> .env

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U lms_user -d lms_db; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 2
        done

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test

    - name: Build Docker images
      run: |
        docker build -t lms-backend-test .
        docker build -t lms-celery-test .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://${{ secrets.DOMAIN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "echo 'SSH OK'"

      - name: Copy files to server via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='.env.*' \
            --exclude='*.sqlite3' \
            --exclude='media' \
            --exclude='logs' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/lms/

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'SSH_EOF'
            cd /var/www/lms
            
            cat > .env << 'ENV_EOF'
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            DOMAIN=${{ secrets.DOMAIN }}
            ALLOWED_HOSTS=${{ secrets.DOMAIN }},www.${{ secrets.DOMAIN }},84.38.183.202,localhost,127.0.0.1,backend
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_HOST=db
            DATABASE_PORT=5432
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_DB=0
            CELERY_BROKER_URL=redis://redis:6379/0
            CELERY_RESULT_BACKEND=redis://redis:6379/0
            FLOWER_USER=${{ secrets.FLOWER_USER }}
            FLOWER_PASSWORD=${{ secrets.FLOWER_PASSWORD }}
            SITE_URL=https://${{ secrets.DOMAIN }}
            ENV_EOF
            
            docker compose down || true
            docker compose up -d --build
            
            sleep 15
            docker compose exec -T backend poetry run python manage.py migrate --noinput || true
            docker compose exec -T backend poetry run python manage.py collectstatic --noinput || true
            docker compose exec -T backend bash -c "grep -q \"ALLOWED_HOSTS += \['backend'\]\" config/settings.py || echo \"ALLOWED_HOSTS += ['backend']\" >> config/settings.py"
            docker compose restart backend
            
            echo "✅ Deployment complete!"
          SSH_EOF