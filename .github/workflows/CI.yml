name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lms_db
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create false

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-ansi

    - name: Create .env file for tests
      run: |
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=localhost" >> .env
        echo "DATABASE_NAME=lms_db" >> .env
        echo "DATABASE_USER=lms_user" >> .env
        echo "DATABASE_PASSWORD=lms_password" >> .env
        echo "DATABASE_HOST=localhost" >> .env
        echo "DATABASE_PORT=5432" >> .env
        echo "REDIS_HOST=localhost" >> .env
        echo "REDIS_PORT=6379" >> .env
        echo "REDIS_DB=0" >> .env
        echo "CELERY_BROKER_URL=redis://localhost:6379/0" >> .env
        echo "CELERY_RESULT_BACKEND=redis://localhost:6379/0" >> .env

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U lms_user -d lms_db; do
          echo "Waiting for PostgreSQL to be ready..."
          sleep 2
        done

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Запускаем всегда после успешных тестов, но с проверкой секретов внутри
    if: success()
    environment:
      name: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      # url не используем, чтобы избежать ошибки с секретами

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check if secrets are available for deployment
      id: check_secrets
      run: |
        if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
          echo "Secrets not available in this context (likely a PR from fork)"
          echo "Skipping deployment"
          echo "skip_deploy=true" >> $GITHUB_OUTPUT
        else
          echo "Secrets available, proceeding with deployment"
          echo "skip_deploy=false" >> $GITHUB_OUTPUT
        fi

    - name: Copy files to server via rsync
      if: steps.check_secrets.outputs.skip_deploy == 'false'
      uses: burnett01/rsync-deployments@6.0.0
      with:
        switches: -avzr --delete --exclude='.env' --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='.pytest_cache' --exclude='.ruff_cache' --exclude='.env.*' --exclude='*.sqlite3' --exclude='media'
        path: ./
        remote_path: /var/www/lms/
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

    - name: Deploy with Docker Compose
      if: steps.check_secrets.outputs.skip_deploy == 'false'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          cd /var/www/lms
          
          # Создаем .env файл из секретов
          cat > .env << 'EOF'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=${{ github.ref == 'refs/heads/main' && 'False' || 'True' }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          
          DATABASE_NAME=${{ secrets.DATABASE_NAME }}
          DATABASE_USER=${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST=${{ secrets.DATABASE_HOST }}
          DATABASE_PORT=5432
          
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
          
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          
          SITE_URL=${{ secrets.SITE_URL }}
          EOF
          
          # Останавливаем контейнеры
          docker compose down
          
          # Собираем и запускаем контейнеры
          docker compose up -d --build
          
          # Очищаем неиспользуемые образы
          docker image prune -f
          
          # Ждем запуска контейнеров
          sleep 10
          
          # Выполняем миграции
          docker compose exec -T backend poetry run python manage.py migrate --noinput
          
          # Собираем статику
          docker compose exec -T backend poetry run python manage.py collectstatic --noinput
          
          # Проверяем статус контейнеров
          docker compose ps

    - name: Skip deployment notification
      if: steps.check_secrets.outputs.skip_deploy == 'true'
      run: |
        echo "==========================================="
        echo "⚠️  DEPLOYMENT SKIPPED"
        echo "==========================================="
        echo "Reason: Deployment secrets not available"
        echo "Context: ${{ github.event_name }} on ${{ github.ref }}"
        echo ""
        echo "Deployment will run automatically when:"
        echo "  - Push to 'develop' or 'main' branches"
        echo "  - Or when PR is merged from trusted branch"
        echo "==========================================="